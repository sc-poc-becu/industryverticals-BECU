        <div class="ck-content"><h1>What Is a HELOC and How Does It Work?</h1><p>A home equity line of credit is a revolving credit line that lets you borrow against the equity in your home. Somewhat like a credit card, you can draw funds as needed up to your credit limit, repay and borrow again during the draw period.</p><h1>HELOC Features and Benefits</h1><p>HELOCs are great for home improvement projects, debt consolidations and paying ongoing expenses over time. BECU HELOCs offer:</p><ul><li>Low, interest-only payments during 10-year draw period.</li><li>Option to lock in your rate on up to three loan amounts.</li><li>Loans up to $500,000.</li><li>No appraisal cost or annual fee.2</li><li>Access to funds when you need them.</li></ul><h1>HELOC vs. Home Equity Loan: Key Differences</h1><p>A HELOC lets you borrow from your available credit line over time during the draw period, while a home equity loan provides a one-time lump sum.</p><p>BECU offers HELOCs because they give members flexible access to funds and the freedom to use their home's equity when it matters most.</p><h1>Fixed-Rate Advance: Lock In Part of Your HELOC Payments</h1><p>Looking for more predictability in your payments? Lock in a stable rate on a portion of your new or existing home equity line of credit (HELOC).<sup>3,4</sup></p><ul><li>Rates range from 7.24% to 10.34% APR.</li><li>Fixed payments for easier budgeting.</li><li>Flexible loan amounts and terms (up to 15 years).<sup>4</sup></li></ul><p>Lock in the rate for all or a portion of your home equity line of credit limit for a specific term.4</p><h1>How Much Can I Borrow With a HELOC?</h1><p>With a HELOC, you could qualify to borrow up to 80% of your home's value with a maximum loan amount of $500,000, minus your current mortgage balance. Qualification depends on your income, credit history, property value and home equity.</p><h1>Draw Period vs. Repayment: What to Expect</h1><p>A BECU HELOC is structured in two phases:</p><h2>Draw Period (10 years):</h2><p>During this time, you can borrow funds as needed — up to your credit limit — and make interest-only payments. You can also place part or all your balance into a Fixed Rate Advance. Your payments on this portion would be principal and interest.</p><h2>Repayment Period (15 years):</h2><p>Once the draw period ends, you'll begin repaying the remaining balance with monthly payments that include both principal and interest.</p><h1>Popular Ways To Use a HELOC</h1><p>Because a HELOC is a revolving credit line, you can use it as needs arise during the draw period. Many members use their line of credit to:</p><ul><li>Fund home renovations or repairs to update or maintain their property.</li><li>Invest in home improvements that may increase value over time.</li><li>Consolidate high-interest debt into one low-rate monthly payment.</li><li>Cover education costs, medical bills or other unexpected expenses.</li></ul><h1>How to Apply for a HELOC</h1><p>Applying for a HELOC is simple. You can submit your application online, by phone or in person at any BECU Neighborhood Financial Center. Existing members can apply from within Online Banking. You'll provide income and details about your home. Your application will be reviewed, and you will be informed of our decision. Learn what to expect during the HELOC application process. Not a BECU member yet? <a href="https://becu.org" target="_blank" title="Join BECU and Apply.">Join BECU and Apply.</a></p><h1>Contact a BECU Member Consultant</h1><p>Have questions or ready to get started? Our member consultants can walk you through your options, explain the application process, and help you decide if a HELOC may be the right fit for your goals. Drop by a location, or schedule a time to talk to a BECU member consultant or give us a call at 844-BECULOAN (844-232-8562).</p></div>
