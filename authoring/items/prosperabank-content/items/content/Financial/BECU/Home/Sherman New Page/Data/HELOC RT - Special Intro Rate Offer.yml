        <div class="ck-content"><h3 style="text-align:center;">Special Introductory Rate Offer</h3><p>Apply for a new home equity line of credit (HELOC) and get an introductory rate as low as 4.49% APR for six months <strong>when you apply by July 31, 2026</strong>.<sup>1</sup> After the introductory period, your rate will range from 6.99% to 9.84% variable APR based on your creditworthiness.<sup>2</sup> This offer is restricted to owner-occupied properties.</p></div>
