    - ID: "0b7c2b1b-995e-4727-b060-988c60fbae9a"
      Hint: Text
      Value: |
        <div class="ck-content"><p><span style="color:#4d5f69;">During the HELOC intro period your minimum payment amount may be less. During the intro period and after, your monthly payment will equal the amount of accrued interest, subject to the lesser of $100 or your outstanding balance. Because the minimum monthly payment during the draw period is interest only, your principal balance may not be reduced. At the end of the draw period, your monthly payment will increase and equal the amount of principal and interest necessary to pay off the loan balance by the end of the 180-month repayment period. Your payments during both the draw and repayment periods will not include amounts due for property taxes and insurance. The APRs for BECU's HELOCs are variable and are based on the highest Prime Rate as published in the Wall Street Journal on the last day of the previous month plus an applicable margin. Current HELOC rates range from 6.99% APR – 9.84% APR as of 4/10/2026 and are subject to change. The maximum APR that can apply to BECU's HELOCs is 18%. APRs do not include costs other than interest.</span></p></div>
