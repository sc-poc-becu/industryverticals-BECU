    - ID: "d50dd51e-82d0-44a9-9ad2-ec8322493f6f"
      Hint: Body
      Value: "<p>A home equity line of credit (HELOC) is a variable-rate loan secured by your home. The interest rate and monthly payment may change over time based on market conditions. Because your home is used as collateral, failure to meet repayment obligations could result in foreclosure. Fees, minimum draw requirements, and other terms may apply. This information is provided to help you understand how a HELOC works and is not a commitment to lend.</p>"
