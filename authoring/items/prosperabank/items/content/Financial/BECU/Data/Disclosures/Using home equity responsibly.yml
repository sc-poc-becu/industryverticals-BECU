    - ID: "c0e60ae0-3478-416f-8596-ca71351c973d"
      Hint: Summary
      Value: Considerations to help you evaluate whether borrowing against your home is right for you.
    - ID: "d50dd51e-82d0-44a9-9ad2-ec8322493f6f"
      Hint: Body
      Value: "<p>Borrowing against your home can provide financial flexibility, but it also increases your overall debt and reduces available home equity. Members should consider their ability to repay the balance, the purpose of the funds, and how long they expect to carry the balance. A HELOC may not be appropriate for short-term or discretionary expenses. Reviewing alternatives and speaking with a BECU representative can help support informed decision-making.</p>"
