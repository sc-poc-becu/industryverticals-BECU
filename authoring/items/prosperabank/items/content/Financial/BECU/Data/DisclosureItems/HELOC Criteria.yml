    - ID: "0b7c2b1b-995e-4727-b060-988c60fbae9a"
      Hint: Text
      Value: "<p>Financing is subject to BECU membership, credit approval and other underwriting criteria in the following states: WA, AZ, CA, ID, IL, KS, MI, OR, PA, SC; not every applicant will qualify. BECU must be able to perfect a first or second mortgage lien on your one-to-four family residence. Borrower will not have to pay any upfront fees to open the HELOC in normal circumstances. Borrower is required to pay for optional services (e.g., if Borrower retains an attorney that Borrower is not required to use). In South Carolina, where the law requires use of an attorney, BECU will be solely responsible for paying all attorneys' fees and costs necessary to open the HELOC and will perform this responsibility fully by paying all reasonable attorneys' fees and costs related specifically to the closing based on rates typically charged by attorneys in the local market for the closing of similar HELOC transactions. If the title report shows more than one existing lien, judgments, deceased owners or other title issues, or if the appraisal shows problems with the subject property, however, then Borrower may be required to pay third parties to subordinate or otherwise resolve such title issues and/or to repair or otherwise resolve such property problems. These third-party charges may range from an average of $150.00 to $775.00 based on the specific circumstance. This range of charges does not include estimates for the costs of home repairs. Additional state or local mortgage fees or taxes may apply. Borrower will be required to pay for hazard insurance (including flood insurance, if applicable) throughout the term of the HELOC. When the HELOC terminates, Borrower will be required to pay a reconveyance fee of up to $327.50. This fee must also be paid when refinancing your existing BECU HELOC with a new HELOC &mdash; this fee is subject to change at any time. Loan programs, terms and conditions are subject to change without notice.</p>"
