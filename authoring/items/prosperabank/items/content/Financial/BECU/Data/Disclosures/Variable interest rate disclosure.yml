    - ID: "c0e60ae0-3478-416f-8596-ca71351c973d"
      Hint: Summary
      Value: How changes in interest rates may affect your payments and balance.
    - ID: "d50dd51e-82d0-44a9-9ad2-ec8322493f6f"
      Hint: Body
      Value: <p>HELOCs typically have variable interest rates that may increase or decrease over the life of the line of credit. Changes to the interest rate will affect the amount of your monthly payment and the total interest paid over time. Rate adjustments are based on an index and margin as outlined in your agreement. Members should consider the potential impact of rate increases when evaluating whether a HELOC is appropriate for their financial situation.</p>
