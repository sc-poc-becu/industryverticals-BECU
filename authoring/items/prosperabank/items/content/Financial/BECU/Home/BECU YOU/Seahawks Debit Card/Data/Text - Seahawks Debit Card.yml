        <div class="ck-content"><p>With the official debit card of the Seahawks, you'll score access to over 77,000 surcharge-free ATMs nationwide, BECU's Save-Up tool, exclusive discounts and more.</p><h1>Join the Team That Has Your Back and Get the Seahawks Debit Card</h1><p>You must be a BECU member<sup>1</sup> with a checking account to get the Seahawks debit card. To become a member, you can <a href="https://www.becu.org/open-credit-union-account-online">join online</a> or at a <a href="https://www.becu.org/locations/find-locations">BECU location</a> near you.</p><h2>Card Benefits</h2><ul><li>No monthly service fees</li><li><a href="https://www.becu.org/locations/find-locations">Access to 77,000+ surcharge-free ATMs</a> across the globe</li><li>Free fraud protection<sup>2</sup></li><li>No foreign-transaction fee<sup>3</sup> on international purchases or ATM withdrawals</li><li><a href="https://www.becu.org/everyday-banking/debit-card">Online debit card management tools</a> (activate or pause your card, change PIN, etc.)</li><li>Compatible with digital wallet apps (Google Wallet™, Apple Pay®, Samsung Pay™ and others)</li><li><a href="https://www.becu.org/everyday-banking/Checking/mastercard-automatic-billing-updater">Automatic Billing Updater (ABU)</a> functionality, a free Mastercard service that helps you avoid missed payments when your debit card expires<sup>4</sup></li></ul><h2>For Existing BECU Members</h2><p>Members can request a new Seahawks debit card<sup>4</sup> in any of the following ways:</p><ol><li><a href="https://www.becu.org/support/messenger">Send us a secure message</a> via Messenger in the BECU App or Online Banking (just look for the teal and white circle icon in the lower right-hand corner).</li><li><a href="tel://800-233-2328">Call us at 800-233-2328</a> and request the new Seahawks card design.</li><li><a href="https://www.becu.org/support/make-an-appointment">Make an appointment</a> at a BECU Neighborhood Financial Center and we can reprint a new Seahawks debit card for you on the spot.</li></ol><h2>BECU Membership Eligibility</h2><p>If you love the card but don't live in Washington, <a href="https://www.becu.org/members-matter/about-membership/Eligibility">check out our membership eligibility page.</a></p><h2>Related Content</h2><ul><li><a href="https://www.becu.org/everyday-banking/debit-card">BECU Debit Cards</a></li><li><a href="https://www.becu.org/everyday-banking/Checking">BECU Checking</a></li><li><a href="https://www.becu.org/open-credit-union-account-online">About BECU Membership</a></li></ul><p>&nbsp;</p><hr /><p>&nbsp;</p><p><sup>1</sup> BECU membership required. Member Share or Member Advantage savings account and also a checking account required to receive the Seahawks debit card; not everyone will qualify.</p><p><sup>2</sup> To learn more about card benefits, view the Mastercard Guide to Benefits.</p><p><sup>3</sup> 0.20% currency conversion fee may be included in the purchase or withdrawal's overall total when using a debit card; however, the fee will be refunded within 3 business days contingent upon the account being open at the time of refund.</p><p><sup>4</sup> Once the replacement card is activated, the new expiration date is automatically updated with participating merchants. Cards that have been reissued due to fraud or because of being lost or stolen are not eligible for this service as those cards will have new card numbers. If you aren't sure if a merchant is participating in ABU, be sure to review your stored card information to verify it's been updated and payment is not missed. BECU will not be responsible for any missed payments. Enrollment in this service is automatic. If you'd like to opt out, you can do so by contacting us.</p></div>
