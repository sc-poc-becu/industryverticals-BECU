        <div class="ck-content"><h2>HELOC FAQs</h2><h3>Are there fees or closing costs for a BECU HELOC?</h3><p>There is no annual fee, application fee or origination fee.</p><p>However, you may be responsible for certain third-party closing costs — typically ranging from $150 to $700 — depending on your property and loan details. These may include title-related services, lien subordination or property-related issues. When the HELOC ends, the borrower will be required to pay a reconveyance fee ranging from an average of $25 to $327.50.</p><h3>How long do I have to repay a BECU HELOC?</h3><p>You have 15 years (180 months) to repay your HELOC after the 10-year draw period ends.</p><h3>How do I access funds from a HELOC?</h3><p>You can transfer funds online, by phone , the mobile app or in person.</p><h3>What is the monthly payment on a $50,000 HELOC?</h3><p>Your monthly payment depends on how much you borrow, your interest rate and whether your balance is on the variable portion of the HELOC or in a Fixed Rate Advance. But as an example, if you draw $50,000 and make interest-only payments at a hypothetical rate of around 6% APR, your payment would be about $250 per month. If you move that balance to a Fixed Rate Advance for 15 years at a similar rate, your payment would be about $450 per month. Actual rates and payments will vary.<sup>4</sup></p><h3>How do payments work on a BECU HELOC?</h3><p>During the 10-year draw period, you make interest-only payments on your balance unless you move any of the balance to a Fixed Rate Advance which would require principal and interest payments. After 15 years, once the repayment period begins, your payments will include principal and interest.</p></div>
